<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Thread & Warm Bronze Gradients -->
    <linearGradient id="bronzeThread" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C27A45" />
      <stop offset="35%" stop-color="#9C562B" />
      <stop offset="70%" stop-color="#7B3F1B" />
      <stop offset="100%" stop-color="#B26C3A" />
    </linearGradient>

    <linearGradient id="cremaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C59A" />
      <stop offset="50%" stop-color="#C6925B" />
      <stop offset="100%" stop-color="#8C5325" />
    </linearGradient>

    <!-- Linen Fabric Texture Simulation -->
    <radialGradient id="linenCanvas" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="85%" stop-color="#F2EDE4" />
      <stop offset="100%" stop-color="#E6DFD3" />
    </radialGradient>

    <filter id="embroideredShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#1F1712" flood-opacity="0.25" />
    </filter>

    <!-- Path for curved text ENRICH EVERY MOMENT -->
    <path id="enrichArc" d="M 125 340 A 180 180 0 0 0 375 340" fill="none" />
  </defs>

  <!-- Circular Badge Canvas Background -->
  <circle cx="250" cy="250" r="236" fill="url(#linenCanvas)" stroke="#E0D7C9" stroke-width="2" />

  <!-- Outer Stitched Circle Ring -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#221A15" stroke-width="5" />
  <circle cx="250" cy="250" r="208" fill="none" stroke="#221A15" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- TOP CRESCENT MOON & STAR (Embroidered in Dark Espresso) -->
  <g transform="translate(250, 48)" filter="url(#embroideredShadow)">
    <!-- Crescent Moon -->
    <path d="M 0 -18 A 17 17 0 1 0 14 13 A 13.5 13.5 0 1 1 -3 -15.5 A 16 16 0 0 0 0 -18 Z" fill="#221A15" />
    <!-- 5-Point Star -->
    <polygon points="12,-4 14,0 18,-1 15,3 17,7 13,5 10,8 10,4 6,2 10,0" fill="#221A15" />
  </g>

  <!-- STEAMING COFFEE CUP (Center-Top inside circle) -->
  <g transform="translate(250, 155)" filter="url(#embroideredShadow)">
    <!-- Steam wisps -->
    <path d="M -9 -34 C -12 -28, -6 -23, -9 -17" fill="none" stroke="#221A15" stroke-width="2" stroke-linecap="round" />
    <path d="M 0 -38 C -4 -30, 4 -24, 0 -17" fill="none" stroke="#221A15" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 9 -34 C 6 -28, 12 -23, 9 -17" fill="none" stroke="#221A15" stroke-width="2" stroke-linecap="round" />

    <!-- Cup Body & Saucer -->
    <!-- Saucer -->
    <path d="M -36 5 Q 0 13 36 5 Q 0 8 -36 5 Z" fill="#221A15" />
    <ellipse cx="0" cy="6" rx="36" ry="3.5" fill="#221A15" />
    
    <!-- Cup Base & Body -->
    <path d="M -26 -14 Q -27 2 0 3 Q 27 2 26 -14 Z" fill="#221A15" />
    
    <!-- Cup Handle -->
    <path d="M 23 -12 C 34 -11, 34 0, 21 0" fill="none" stroke="#221A15" stroke-width="3" stroke-linecap="round" />

    <!-- Fluffy Crema / Froth Top with stitch cross-hatch -->
    <ellipse cx="0" cy="-14" rx="26" ry="6" fill="url(#cremaGrad)" stroke="#221A15" stroke-width="1.5" />
    <!-- Froth texture arches -->
    <path d="M -18 -14 Q -12 -17 -6 -14 Q 0 -17 6 -14 Q 12 -17 18 -14" fill="none" stroke="#683B19" stroke-width="1.2" />
    <path d="M -14 -12 Q -7 -14 0 -12 Q 7 -14 14 -12" fill="none" stroke="#FAF7F2" stroke-width="1" opacity="0.7" />
  </g>

  <!-- EMBROIDERED CALLIGRAPHY: "New Tenzo" -->
  <g filter="url(#embroideredShadow)">
    <!-- "New" Script in Warm Bronze -->
    <text x="250" y="208" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-weight="600" font-size="28" fill="url(#bronzeThread)" stroke="#683414" stroke-width="0.75" letter-spacing="1">
      New
    </text>

    <!-- "Tenzo" Flowing Embroidery Script -->
    <!-- Shadow stroke to give 3D embroidered thread depth -->
    <text x="250" y="274" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Brush Script MT', cursive" font-style="italic" font-weight="800" font-size="76" fill="none" stroke="#4A200B" stroke-width="6" stroke-linejoin="round">
      Tenzo
    </text>
    <text x="250" y="274" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Brush Script MT', cursive" font-style="italic" font-weight="800" font-size="76" fill="url(#bronzeThread)" stroke="#FAF7F2" stroke-width="0.5" stroke-dasharray="4,1">
      Tenzo
    </text>
  </g>

  <!-- "CAFE & BAKERS" (Clean, bold uppercase below Tenzo) -->
  <g filter="url(#embroideredShadow)">
    <text x="250" y="308" text-anchor="middle" font-family="'Outfit', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="21" fill="#221A15" letter-spacing="4.5">
      CAFE &amp; BAKERS
    </text>
  </g>

  <!-- WHEAT LAUREL LEAVES FLANKING THE BOTTOM (Left & Right) -->
  <!-- Left Laurel Leaves -->
  <g transform="translate(108, 305)" fill="#221A15">
    <path d="M 0 0 C -4 -7, -10 -8, -13 -6 C -11 -2, -6 0, 0 0 Z" />
    <path d="M 5 11 C -1 5, -8 6, -11 9 C -8 12, -2 13, 5 11 Z" />
    <path d="M 12 21 C 6 17, 0 19, -3 23 C 1 25, 7 24, 12 21 Z" />
  </g>

  <!-- Right Laurel Leaves -->
  <g transform="translate(392, 305)" fill="#221A15">
    <path d="M 0 0 C 4 -7, 10 -8, 13 -6 C 11 -2, 6 0, 0 0 Z" />
    <path d="M -5 11 C 1 5, 8 6, 11 9 C 8 12, 2 13, -5 11 Z" />
    <path d="M -12 21 C -6 17, 0 19, 3 23 C -1 25, -7 24, -12 21 Z" />
  </g>

  <!-- CURVED TEXT: "ENRICH EVERY MOMENT" along bottom circumference -->
  <text font-family="'Outfit', sans-serif" font-weight="800" font-size="14.5" fill="#221A15" letter-spacing="3.5">
    <textPath href="#enrichArc" startOffset="50%" text-anchor="middle">
      ENRICH EVERY MOMENT
    </textPath>
  </text>
</svg>
